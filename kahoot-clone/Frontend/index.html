<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Clone Class</title>
  <!-- Socket.io Client Script -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    button { padding: 12px 24px; font-size: 16px; margin: 8px; border: none; border-radius: 6px; cursor: pointer; color: white; }
    .red { background: #e21b3c; } .blue { background: #1368ce; }
    .yellow { background: #d89e00; } .green { background: #26890c; }
    input { padding: 10px; width: 80%; margin-bottom: 12px; font-size: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kahoot Class Clone</h2>

    <!-- Halaman Join Player -->
    <div id="join-screen">
      <input type="text" id="username" placeholder="Masukkan Nama Kamu">
      <br>
      <button class="blue" onclick="joinGame()">Masuk Game</button>
    </div>

    <!-- Halaman Waiting Room -->
    <div id="waiting-screen" class="hidden">
      <h3>Menunggu Guru Memulai Kuis...</h3>
      <h4>Daftar Pemain:</h4>
      <ul id="player-list" style="list-style: none; padding: 0;"></ul>
    </div>

    <!-- Halaman Pilihan Jawaban Player -->
    <div id="quiz-screen" class="hidden">
      <h3>Pilih Jawaban di Layar Proyektor:</h3>
      <button class="red" onclick="sendAnswer(0)">▲ Merah</button>
      <button class="blue" onclick="sendAnswer(1)">◆ Biru</button><br>
      <button class="yellow" onclick="sendAnswer(2)">● Kuning</button>
      <button class="green" onclick="sendAnswer(3)">■ Hijau</button>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL BACKEND RENDER KAMU NANTI!
    const BACKEND_URL = "https://kahoot-rizwan-sensei.onrender.com"; 
    const socket = io(BACKEND_URL);

    function joinGame() {
      const name = document.getElementById('username').value;
      if (name) {
        socket.emit('join-game', { name: name });
        document.getElementById('join-screen').classList.add('hidden');
        document.getElementById('waiting-screen').classList.remove('hidden');
      }
    }

    function sendAnswer(optionIndex) {
      // Contoh: Anggap jawaban benar adalah index 1 (Biru)
      const isCorrect = (optionIndex === 1);
      socket.emit('submit-answer', { isCorrect: isCorrect });
      alert(isCorrect ? "Jawaban Terkirim! (Benar)" : "Jawaban Terkirim! (Salah)");
    }

    socket.on('update-player-list', (players) => {
      const list = document.getElementById('player-list');
      list.innerHTML = players.map(p => `<li><b>${p.name}</b> - Skor: ${p.score}</li>`).join('');
    });

    socket.on('game-started', () => {
      document.getElementById('waiting-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
    });
  </script>
</body>
</html>
